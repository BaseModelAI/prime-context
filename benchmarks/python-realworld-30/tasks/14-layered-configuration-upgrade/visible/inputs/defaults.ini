[app]
name = "Orion"
edition = "community"
debug = false
features = ["core", "search"]
banner = "${app.name} at ${network.host}:${network.port} (TLS=${network.tls})"

[server]
bind = "127.0.0.1"
port = 7000

[network]
port = 8000
tls = false

[database]
host = "db.default.internal"
port = 5432
username = "default_user"
options = {"connect_timeout":5,"application_name":"orion"}

[database.credentials]
password_secret = "default-password"

[paths]
data_dir = "/srv/orion"
log_dir = "${paths.data_dir}/logs"

[logging]
level = "INFO"
handlers = ["console"]
format = %(levelname)s:%(message)s

[service]
label = "Legacy default name"
